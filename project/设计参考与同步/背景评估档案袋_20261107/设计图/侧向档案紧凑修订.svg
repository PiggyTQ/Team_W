<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485"><rect width="1200" height="485" fill="#fffdf8"/><style>text{font-family:Arial,Microsoft YaHei,sans-serif;fill:#244a70}</style><text x="28" y="35" font-size="16">修订设计图 · 侧向档案与紧凑陈列</text><rect x="28" y="65" width="350" height="370" rx="16" fill="#fffefa" stroke="#e4e0d4"/><text x="48" y="100" font-size="18">核对经历与个人贡献</text><text x="48" y="145" font-size="14">处理队列与既有材料</text><rect x="399" y="65" width="773" height="335" rx="16" fill="#f8f7f1" stroke="#e6dfd0"/><text x="421" y="103" font-size="17">经历档案</text><path d="M665 140L688 147V355L665 363Z" fill="#fefcf4" stroke="#d8dedf"/><rect x="600" y="140" width="68" height="223" rx="6" fill="#c7dff3" stroke="#b6c8d4"/><rect x="617" y="185" width="34" height="124" rx="3" fill="#eaf4fd"/><text x="635" y="178" font-size="12" text-anchor="middle">01</text><text x="634" y="199" font-size="14" writing-mode="vertical-rl" text-orientation="upright">手填已有经历</text><path d="M780 140L803 147V355L780 363Z" fill="#fefcf4" stroke="#d8dedf"/><rect x="715" y="140" width="68" height="223" rx="6" fill="#ecd9ad" stroke="#b6c8d4"/><rect x="732" y="185" width="34" height="124" rx="3" fill="#fff6df"/><text x="750" y="178" font-size="12" text-anchor="middle">02</text><text x="749" y="199" font-size="14" writing-mode="vertical-rl" text-orientation="upright">导入文件</text><path d="M895 140L918 147V355L895 363Z" fill="#fefcf4" stroke="#d8dedf"/><rect x="830" y="140" width="68" height="223" rx="6" fill="#cadee7" stroke="#b6c8d4"/><rect x="847" y="185" width="34" height="124" rx="3" fill="#edf5f7"/><text x="865" y="178" font-size="12" text-anchor="middle">03</text><text x="864" y="199" font-size="14" writing-mode="vertical-rl" text-orientation="upright">先了解实践</text><text x="28" y="467" font-size="13">侧向书脊 + 少量可见纸页厚度；收紧陈列高度。纸页展开覆盖右侧陈列区域，周围区块位置保持。</text></svg>