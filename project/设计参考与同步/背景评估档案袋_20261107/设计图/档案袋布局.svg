<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660"><rect width="1440" height="660" rx="20" fill="#fffdf8"/><style>text{font-family:Arial,Microsoft YaHei,sans-serif;fill:#24476b}.muted{fill:#708299}.small{font-size:14px}</style><text x="32" y="35" class="small muted">实施前设计图 · 背景评估交互式档案袋 · 2026-11-07</text><text x="32" y="82" font-size="24" font-weight="600">背景评估</text><text x="32" y="112" class="small muted">核对自己做过的事，确认后才用于画像、评估和简历。</text><rect x="32" y="145" width="420" height="450" rx="18" fill="#fff" stroke="#e4e0d4"/><text x="54" y="182" font-size="19">核对经历与个人贡献</text><text x="54" y="220" class="small muted">处理队列</text><rect x="54" y="234" width="376" height="42" rx="9" fill="#fffdf8" stroke="#e4e0d4"/><text x="70" y="260" class="small">全部</text><text x="54" y="322" font-size="17">先记录经历，再逐项确认</text><text x="54" y="355" class="small muted">从右侧档案袋开始，保存后在此核对。</text><text x="54" y="407" class="small">ⓘ 查看操作步骤</text><rect x="474" y="145" width="934" height="450" rx="18" fill="#f7f6f1" stroke="#e8e3d8"/><text x="500" y="182" font-size="17">经历档案</text><rect x="545" y="257" width="203" height="260" rx="18" fill="#d8d2c8" opacity=".18"/><path d="M540 269Q540 247 562 247H640L659 265H723Q745 265 745 287V489Q745 509 723 509H562Q540 509 540 487Z" fill="#c7dff3" stroke="#afbdc9"/><rect x="555" y="259" width="173" height="155" rx="8" fill="#fffefa"/><path d="M540 334Q645 308 745 334V489Q745 509 723 509H562Q540 509 540 487Z" fill="#c7dff3" stroke="#ffffff"/><rect x="560" y="373" width="165" height="83" rx="10" fill="#eef6ff"/><text x="574" y="402" font-size="17">手填已有经历</text><text x="574" y="431" font-size="12" class="muted">记录自己的经历</text><rect x="805" y="257" width="203" height="260" rx="18" fill="#d8d2c8" opacity=".18"/><path d="M800 269Q800 247 822 247H900L919 265H983Q1005 265 1005 287V489Q1005 509 983 509H822Q800 509 800 487Z" fill="#e9d4a2" stroke="#afbdc9"/><rect x="815" y="259" width="173" height="155" rx="8" fill="#fffefa"/><path d="M800 334Q905 308 1005 334V489Q1005 509 983 509H822Q800 509 800 487Z" fill="#e9d4a2" stroke="#ffffff"/><rect x="820" y="373" width="165" height="83" rx="10" fill="#fff8e6"/><text x="834" y="402" font-size="17">导入文件</text><text x="834" y="431" font-size="12" class="muted">模拟解析 / 原文核对</text><rect x="1065" y="257" width="203" height="260" rx="18" fill="#d8d2c8" opacity=".18"/><path d="M1060 269Q1060 247 1082 247H1160L1179 265H1243Q1265 265 1265 287V489Q1265 509 1243 509H1082Q1060 509 1060 487Z" fill="#cadfe7" stroke="#afbdc9"/><rect x="1075" y="259" width="173" height="155" rx="8" fill="#fffefa"/><path d="M1060 334Q1165 308 1265 334V489Q1265 509 1243 509H1082Q1060 509 1060 487Z" fill="#cadfe7" stroke="#ffffff"/><rect x="1080" y="373" width="165" height="83" rx="10" fill="#f0f7fa"/><text x="1094" y="402" font-size="17">先了解实践</text><text x="1094" y="431" font-size="12" class="muted">从一次尝试开始</text><text x="500" y="556" class="small muted">悬停轻抬 → 抽出袋口纸页 → 原位展开实际表单 → 收拢归位</text><text x="32" y="636" class="small muted">参考只借鉴排列意象；文件袋采用柔和纸材层次。左侧约 1/3，右侧约 2/3。打开后纸页占右侧，原有业务逻辑与草稿继续复用。</text></svg>