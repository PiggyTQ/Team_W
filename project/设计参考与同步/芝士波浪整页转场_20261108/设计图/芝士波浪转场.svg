  <text x="45" y="545" class="body">点击后锁定本次导航，避免重复触发。</text>
  <text x="525" y="545" class="body">4 层暖黄错峰推进，圆润起伏带少量奶酪孔。</text>
  <text x="1005" y="545" class="body">新页先藏在遮罩下，露出后恢复交互与焦点。</text>
