  <text x="69" y="618" class="label">动画与适用范围</text>
  <text x="69" y="650" class="body">总时长约 1.20s：615ms 分层遮满并换页、48ms 保持遮满、540ms 分层退场；旧页遮满前不提交新页面。</text>
  <text x="69" y="678" class="body">目标编辑、计划排期、返回父页、学习实践预览、计划制定 / 执行等整页切换使用；周期页签、选中条目、日历定位和弹窗不触发。</text>
  <text x="69" y="706" class="body">现有模块内幕布保持；系统偏好“减少动态效果”时立即完成导航；首次直达或刷新不自动播放。</text>
  <text x="45" y="766" class="small">此图为动画意图与分镜设计，非用户已确认稿，非实际页面截图。最终时间与验收证据以实现后的记录为准。</text>
