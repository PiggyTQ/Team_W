<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><rect width="720" height="460" fill="#fffefb"/><style>text{font-family:Arial,Microsoft YaHei,sans-serif;fill:#244a70}</style><text x="30" y="40" font-size="20">个人评估 · 稳定区块顺序（实施前结构图）</text><text x="30" y="75" font-size="14">切换、收起、确认材料与历史导航均不移动区块位置</text><rect x="30" y="100" width="660" height="48" rx="10" fill="#eaf3ff"/><text x="50" y="130" font-size="16">四个导航入口 → 对应区块锚点与焦点</text><rect x="30" y="170" width="660" height="48" rx="10" fill="#edf5ff"/><text x="50" y="201" font-size="16">1 背景评估 · 始终保留，展开 / 收起只改变内部内容</text><rect x="30" y="236" width="660" height="48" rx="10" fill="#fff8e7"/><text x="50" y="267" font-size="16">2 爱好评估</text><rect x="30" y="302" width="660" height="48" rx="10" fill="#edf5ff"/><text x="50" y="333" font-size="16">3 能力评估</text><rect x="30" y="368" width="660" height="48" rx="10" fill="#fff8e7"/><text x="50" y="399" font-size="16">4 综合评估</text></svg>