<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600"><rect width="1080" height="600" fill="#fffefa"/><g font-family="Microsoft YaHei,sans-serif" fill="#244a70"><text x="24" y="34" font-size="22">能力评估 · 紧凑布局（实施前局部设计）</text><text x="24" y="70" font-size="14">对照职业范围</text><rect x="130" y="48" width="220" height="34" rx="9" fill="#fff" stroke="#e6dfd2"/><text x="145" y="70" font-size="13">人工智能</text><text x="376" y="70" font-size="12" fill="#5d728a">掌握状态由本人自评，可随时调整。</text><rect x="24" y="104" width="5" height="19" rx="2" fill="#f7d77c"/><text x="38" y="120" font-size="17">能力拼图</text><text x="140" y="119" font-size="12" fill="#5d728a">点击拼图，查看并更新掌握状态。</text><rect x="24" y="146" width="370" height="272" rx="16" fill="#f5f8fc" stroke="#d9e5ef"/><rect x="42" y="165" width="43" height="22" rx="6" fill="#e3eef8"/><text x="63" y="181" text-anchor="middle" font-size="11">核心</text><text x="42" y="214" font-size="22">错误分析</text><rect x="325" y="165" width="48" height="48" rx="14" fill="#e3eef8"/><path d="M341 181h17v17h-17Z" fill="none" stroke="#6a8eae"/><text x="42" y="251" font-size="13">先定义检查标准，再分析模型失败的情况。</text><path d="M42 271h334" stroke="#d9e5ef"/><text x="42" y="295" font-size="12">当前状态</text><text x="326" y="295" font-size="12">未掌握</text><rect x="42" y="318" width="162" height="42" rx="11" fill="#fffefa" stroke="#e6dfd2"/><rect x="214" y="318" width="162" height="42" rx="11" fill="#fffefa" stroke="#e6dfd2"/><text x="123" y="344" text-anchor="middle" font-size="12">已掌握</text><text x="295" y="344" text-anchor="middle" font-size="12">未掌握</text><rect x="425" y="144" width="164" height="96" rx="7" fill="#94b6d6"/><text x="507" y="197" text-anchor="middle" font-size="14">Python</text><rect x="591" y="144" width="164" height="96" rx="7" fill="#94b6d6"/><text x="673" y="197" text-anchor="middle" font-size="14">数据处理</text><rect x="757" y="144" width="164" height="96" rx="7" fill="#f7d77c"/><text x="839" y="197" text-anchor="middle" font-size="14">Git</text><rect x="425" y="242" width="164" height="96" rx="7" fill="#94b6d6"/><text x="507" y="295" text-anchor="middle" font-size="14">模型评估</text><rect x="591" y="242" width="164" height="96" rx="7" fill="#94b6d6"/><text x="673" y="295" text-anchor="middle" font-size="14">错误分析</text><rect x="757" y="242" width="164" height="96" rx="7" fill="#94b6d6"/><text x="839" y="295" text-anchor="middle" font-size="14">数据质量</text><rect x="425" y="340" width="164" height="96" rx="7" fill="#94b6d6"/><text x="507" y="393" text-anchor="middle" font-size="14">检索增强</text><rect x="591" y="340" width="164" height="96" rx="7" fill="#94b6d6"/><text x="673" y="393" text-anchor="middle" font-size="14">模型部署</text><rect x="757" y="340" width="164" height="96" rx="7" fill="#94b6d6"/><text x="839" y="393" text-anchor="middle" font-size="14">MLOps</text><path d="M928 190h12" stroke="#94b6d6"/><rect x="942" y="178" width="92" height="25" rx="12" fill="#eef4fb" stroke="#d9e5ef"/><text x="988" y="195" text-anchor="middle" font-size="12">基础</text><path d="M928 288h12" stroke="#94b6d6"/><rect x="942" y="276" width="92" height="25" rx="12" fill="#eef4fb" stroke="#d9e5ef"/><text x="988" y="293" text-anchor="middle" font-size="12">核心</text><path d="M928 386h12" stroke="#94b6d6"/><rect x="942" y="374" width="92" height="25" rx="12" fill="#eef4fb" stroke="#d9e5ef"/><text x="988" y="391" text-anchor="middle" font-size="12">进阶</text><text x="24" y="462" font-size="12">自评记录可随时调整，未标记的能力以蓝色展示。</text><path d="M24 483h1010" stroke="#e6dfd2"/><text x="24" y="511" font-size="13">查看材料缺口与下一步</text><text x="815" y="511" font-size="13">查看职业要求与产物</text><text x="24" y="550" font-size="12" fill="#5d728a">底部快照说明保持原语义，采用紧凑提示条。</text><text x="24" y="582" font-size="12">图示只表达排布；实施保留实际圆角凹凸路径、纯色配色和交互。</text></g></svg>