  <g font-size="13" fill="#6a7282"><text x="24" y="60">默认：蓝色统计</text><text x="380" y="60">中段：平滑波浪前沿</text><text x="736" y="60">完成：黄色操作</text><text x="24" y="174">前沿由连续三次贝塞尔曲线形成，保留可见凹凸；黄色覆盖区域同步裁切操作文字，文字位置不随背景平移。</text><text x="24" y="204">600ms 向右推进，移出后向左退回。纯色、细边框、原 6px 圆角，无投影、渐变、透视、翻转或上浮。</text><text x="24" y="234">六卡分别响应，原查看抽屉与执行 / 排期 / 复查入口保持；键盘聚焦同样可显示操作，减少动态时直接切换。</text></g>
