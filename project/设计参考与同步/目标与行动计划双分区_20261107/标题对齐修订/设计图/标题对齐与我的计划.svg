  <text x="24" y="85" font-size="32" font-weight="750" fill="#082f68">目标与行动计划</text>
  <rect x="24" y="118" width="1152" height="218" rx="16" fill="#fff" stroke="#e6dfd2"/>
  <path d="M600 138V316" stroke="#e6dfd2"/>
  <text x="46" y="170" font-size="22" fill="#18202a">我的目标</text>
  <text x="628" y="170" font-size="22" fill="#18202a">我的计划</text>
