  <text x="45" y="545" class="body">顶部与左侧导航始终可见，遮罩随内容边界。</text>
  <text x="525" y="545" class="body">四层奶油黄，宽缓流线，少量低对比哑光孔。</text>
  <text x="1005" y="545" class="body">遮满后换页，沿右下方向退场；约 0.80 秒。</text>
  <rect x="45" y="586" width="1410" height="164" rx="14" fill="#fff" stroke="#dce5ee"/>
  <text x="69" y="618" class="label">区域、节奏与材质</text>
  <text x="69" y="650" class="body">测量可见 #main 矩形并裁切遮罩，只覆盖右侧内容；侧栏展开和收起均以当前实际内容边界为准。</text>
  <text x="69" y="678" class="body">406ms 分层卷入并换页 → 32ms 保持遮满 → 361ms 分层退场；共约 799ms，延续左上到右下的单向运动。</text>
  <text x="69" y="706" class="body">实现色板 #e9bc55 / #f3ce70 / #f9df99 / #ffedb8；减少密集重复波齿，孔洞更小更疏，边缘高光更轻。</text>
  <text x="69" y="734" class="small">减少动态效果、焦点恢复、导航范围、历史中断与窗口变化处理沿用原规范；本次最新约定覆盖此前整视口遮罩与约 1.20 秒节奏。</text>
  <text x="45" y="781" class="small">此图为实施前动画分镜，非实际页面截图或用户已确认稿；实际效果与验证证据保存于本轮设计与验收记录。</text>
