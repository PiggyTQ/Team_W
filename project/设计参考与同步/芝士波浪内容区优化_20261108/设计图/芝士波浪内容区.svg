  <text x="45" y="55" class="title">历史版本 · 芝士波浪右侧内容区优化</text>
  <text x="45" y="88" class="body">799ms 与跨分类导航已被覆盖；当前以“芝士融化波浪与分类内转场_20261108”分镜与验收为准。</text>
  <text x="45" y="142" class="label">01　点击入口，保留界面框架</text>
  <text x="525" y="142" class="label">02　只在内容区内斜向卷入</text>
  <text x="1005" y="142" class="label">03　迅速露出目标内容</text>
