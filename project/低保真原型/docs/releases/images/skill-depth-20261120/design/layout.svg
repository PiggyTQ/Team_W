<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"><rect width="1400" height="820" fill="#fbf9f3"/><g font-family="sans-serif" fill="#174a60"><text x="40" y="45" font-size="24">实施前结构示意 · 不是实际网页截图</text><text x="40" y="100" font-size="19">轻量保存状态 / 归属 / 当前技能 / 返回整树</text><text x="40" y="145" font-size="20">学习　练习　｜目录（左）与有效正文首屏对齐</text><rect x="40" y="175" width="185" height="260" rx="4" fill="#e9eee1"/><text x="60" y="215" font-size="17">按内容组织目录</text><g font-size="19"><text x="275" y="215">概念解释与关键判断直接出现</text><text x="275" y="260">输入表 → 过程与中间结果 → 输出 → 验证</text><text x="275" y="305">代码可复制；解释靠近步骤；适用环境就地说明</text><text x="275" y="350">练习：基础应用 / 查错 / 独立任务，材料站内可见</text><text x="275" y="395">区分参考对照、本人自查与系统实际检验</text></g><path d="M450 510 Q520 450 570 520 M520 600 Q480 540 430 550 M520 600 Q560 540 630 555 M520 600 L520 700 M470 715 Q520 680 570 715" stroke="#a1988b" stroke-width="24" fill="none"/><rect x="820" y="495" width="485" height="230" fill="#fffef8" stroke="#dedecf"/><text x="845" y="535" font-size="19">紧凑检验 / 结果替换题面</text><text x="845" y="580" font-size="17">单题、操作、结果与下一步</text><text x="845" y="620" font-size="17">解析与产物合为一个详情入口</text><text x="40" y="775" font-size="18">检验起点约 57% 树 / 43% 题面；等比完整树形，视觉中心接近，锚点稳定</text></g></svg>
