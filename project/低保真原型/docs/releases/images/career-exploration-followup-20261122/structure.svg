<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#fbf8f0"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#103f6b"><text x="38" y="42" font-size="24">待实现结构 · 职业探索定向完善</text><text x="38" y="73" font-size="15">结构示意，非网页截图；合成内容，不是本人经历</text><rect x="30" y="100" width="860" height="150" rx="14" fill="#fffefa" stroke="#e4dfd3"/><text x="55" y="132" font-size="16">← 返回结果　　数据分析　　　　　　　　收藏　加入比较　比较篮</text><text x="55" y="177" font-size="29">把“报名少了”拆成可以复算的判断</text><text x="55" y="217" font-size="16">主要工作　取数与核对　｜　产物　分析简报　｜　协作　活动负责人与数据同事</text><rect x="30" y="268" width="860" height="42" fill="#e6f2fc"/><text x="54" y="295" font-size="16">工作与案例　　能力准备　　成长协作　　入门体验　　来源　（滚动时保持可达）</text><rect x="30" y="330" width="420" height="215" rx="12" fill="#fffefa" stroke="#e4dfd3"/><text x="53" y="366" font-size="22">活动负责人：报名为什么减少？</text><text x="53" y="405" font-size="16">给定报名日志；按记录去重、排除测试与撤回</text><text x="53" y="445" font-size="16">处理与判断、使用者与复核继续展开可读</text><text x="53" y="488" font-size="16">不从这份记录推断访问量或下降原因</text><rect x="470" y="330" width="420" height="215" rx="12" fill="#edf5fb"/><text x="493" y="366" font-size="22">直接看到本例结果</text><text x="493" y="410" font-size="18">官网　160 → 120　　社群　100 → 100</text><text x="493" y="449" font-size="18">短视频　60 → 60　　合计　320 → 280</text><text x="493" y="498" font-size="18">减少40条报名记录；下降12.5%</text><rect x="30" y="566" width="860" height="275" rx="12" fill="#fffefa" stroke="#e4dfd3"/><text x="55" y="603" font-size="22">产物工作页：口径 → 分析表与图 → 结论简报</text><rect x="55" y="624" width="518" height="98" fill="#e6f2fc"/><text x="77" y="677" font-size="17">完整表格与图并排；不塞进狭窄的中间长卡</text><text x="600" y="654" font-size="16">交给谁 / 解决什么</text><text x="600" y="697" font-size="16">验收 / 下载 / SQL全文</text><text x="55" y="765" font-size="18">当前案例草稿　保存 / 清空　→　学习相关技能（另一套练习）</text><text x="55" y="806" font-size="15">草稿不是已确认材料或掌握证明；不自动发放技能进度</text><rect x="920" y="100" width="490" height="350" rx="14" fill="#fffefa" stroke="#e4dfd3"/><text x="945" y="140" font-size="24">比较：看差异，而非并排文章</text><text x="945" y="186" font-size="17">维度　　　　数据分析　　　数据工程</text><path d="M940 201h450" stroke="#cbdce7"/><text x="945" y="236" font-size="16">问题　　　　解释指标变化　稳定交付分区</text><text x="945" y="279" font-size="16">产物　　　　结论简报　　　契约与重跑记录</text><text x="945" y="322" font-size="16">协作　　　　活动/业务　　 上游/分析/值班</text><text x="945" y="368" font-size="16">准备/首个体验同样用具体短句</text><text x="945" y="414" font-size="15">范围与来源按需查看；表头固定方向；目标预览</text><rect x="920" y="475" width="490" height="366" rx="14" fill="#edf5fb"/><text x="945" y="517" font-size="24">相关材料：正常录入即可闭环</text><text x="945" y="567" font-size="18">本人经历 → 逐项确认</text><text x="945" y="617" font-size="18">关联职业　[数据分析]　可选精确技能</text><text x="945" y="667" font-size="18">保存关联 / 全部解除</text><text x="945" y="717" font-size="18">职业页与“有相关材料”筛选可见</text><text x="945" y="780" font-size="15">后端校验对象与版本，不把SQL当作整个职业准备度</text></g></svg>
