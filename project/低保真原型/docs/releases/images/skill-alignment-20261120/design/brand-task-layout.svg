<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930"><rect width="1500" height="930" fill="#fbf7ed"/><g font-family="sans-serif" fill="#073e70"><text x="55" y="55" font-size="22">实施前布局示意（非实际截图）· 内容与任务已先确定</text><text x="55" y="120" font-size="30">服务信号与告警</text><text x="55" y="162">学习问题 → 原始计数 → 指标 → 规则 → 逐分钟结果 → 复核</text><rect x="55" y="200" width="1390" height="150" rx="16" fill="#eaf4fb"/><text x="80" y="240">连续趋势 · 保留缺测空缺 · 触发依据来自原始计数</text><rect x="55" y="380" width="660" height="330" rx="16" fill="#fffefb" stroke="#d2dfeb"/><text x="80" y="420">分钟、请求、5xx、CPU、p95、错误率</text><rect x="745" y="380" width="700" height="330" rx="16" fill="#fffefb" stroke="#d2dfeb"/><text x="770" y="420">阈值 / 最小请求 / for → pending、firing、unknown</text><text x="770" y="475">计算输入与逐项反馈 · 开放说明与复核分开</text><rect x="770" y="640" width="270" height="45" rx="10" fill="#ffd34f"/><text x="790" y="670">核对本任务</text><text x="55" y="770">检验沿用共同标题与完整透明树；纸白圆角题面，深蓝文本、黄色主行动</text><text x="55" y="825">绿色用于真实通过与树木生长；低频提示与来源按需展开</text></g></svg>
