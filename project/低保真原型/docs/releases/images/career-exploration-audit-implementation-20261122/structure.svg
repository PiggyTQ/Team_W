<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="760"><rect width="1380" height="760" fill="#fbf8f0"/><g fill="#103f6b" font-family="Arial,Microsoft YaHei,sans-serif"><text x="35" y="44" font-size="25">待实现结构：本人记录跨页一致，示范与尝试分工清楚</text><text x="35" y="74" font-size="15">结构示意，非网页截图；沿用蓝黄暖白品牌</text><rect x="30" y="100" width="850" height="130" rx="13" fill="#fffefa" stroke="#e4dfd3"/><text x="55" y="140" font-size="26">数据分析　　已加入比较（普通状态）　　打开比较</text><text x="55" y="180" font-size="17">问题、同例产物和代表工作；完整职业范围仍可查看</text><rect x="30" y="248" width="850" height="48" fill="#e6f2fc"/><text x="50" y="278" font-size="17">数据分析　工作案例　[入门体验·当前位置]　来源与范围</text><rect x="30" y="315" width="410" height="235" rx="12" fill="#fffefa" stroke="#d9e4ea"/><text x="50" y="352" font-size="22">完整材料，带编号</text><text x="50" y="395" font-size="17">D1/D2 · A1–A3 / E1–E3</text><text x="50" y="438" font-size="17">点击编号定位，不默认填答案</text><text x="50" y="500" font-size="17">示范 → 一条短分岔 → 本人尝试</text><rect x="460" y="315" width="420" height="235" rx="12" fill="#edf5fb"/><text x="480" y="352" font-size="22">就近写小产物</text><text x="480" y="395" font-size="17">判断 / 依据 / 未知 / 下一步</text><text x="480" y="438" font-size="17">未保存·本机暂存 / 保存中 / 已保存 / 失败</text><text x="480" y="500" font-size="17">旧版本稿可回查；清空先确认、可恢复</text><rect x="30" y="575" width="850" height="145" rx="12" fill="#fffefa" stroke="#d9e4ea"/><text x="55" y="615" font-size="22">比较与目标理由</text><text x="55" y="656" font-size="17">数据分析[业务指标]　数据工程[分区批处理]　AI[资料问答评测]</text><text x="55" y="693" font-size="17">笔记绑定当前组合＋资料版本；换组合不串用，重排可恢复</text><rect x="910" y="100" width="440" height="620" rx="14" fill="#edf5fb"/><text x="935" y="145" font-size="24">材料关联展开获得操作宽度</text><text x="935" y="200" font-size="18">本人确认原文　SQL仍是本人原文</text><text x="935" y="257" font-size="18">相关职业　→　可选具体节点</text><text x="935" y="314" font-size="18">保存 / 未保存 / 失败与冲突明确</text><text x="935" y="381" font-size="18">选中该材料后才送入AI讨论</text><text x="935" y="438" font-size="18">携带相关关联、版本和指纹</text><text x="935" y="495" font-size="18">解除不复活旧映射</text><text x="935" y="562" font-size="17">不发放检验通过、长叶或准备度</text><text x="935" y="620" font-size="17">不是新资源库或另一套学习课程</text></g></svg>