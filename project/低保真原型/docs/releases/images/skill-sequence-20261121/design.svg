<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#faf6ec"/><g fill="#123f65" font-family="sans-serif"><text x="60" y="60" font-size="26">服务信号与告警 · 内容职责设计（非页面截图）</text><text x="60" y="105" font-size="18">看懂服务数据 → 建立规则 → 验证与整理</text><rect x="60" y="145" width="1320" height="68" rx="14" fill="#edf5fc"/><text x="85" y="187" font-size="18">共同资料入口：服务情境 · 指标定义 · 原始计数 · 来源与运行边界</text><rect x="60" y="240" width="770" height="365" rx="16" fill="#fffefb" stroke="#cfdfed"/><rect x="860" y="240" width="520" height="365" rx="16" fill="#fffefb" stroke="#cfdfed"/><text x="90" y="285" font-size="22">本段观察 / 操作</text><text x="90" y="335" font-size="18">数据段：计数表 + 选中分钟（不先给答案）</text><text x="90" y="385" font-size="18">规则段：参数 + 预测 → 显式运行 → 时间线</text><text x="90" y="435" font-size="18">验证段：六类预期 / 实际对照（复用最近运行）</text><text x="890" y="285" font-size="22">当前问题与有用反馈</text><text x="890" y="335" font-size="18">解释靠近当前操作</text><text x="890" y="385" font-size="18">配置、选择、运行结果跨段保留</text><text x="890" y="435" font-size="18">没有新材料的段落合并</text><rect x="1030" y="535" width="300" height="45" rx="12" fill="#f6ce55"/><text x="1060" y="564" font-size="18">继续当前问题 / 进入练习</text><text x="60" y="670" font-size="18">学习与练习无树；主动进入检验才回到透明树旁。此轮不改评分及历史成绩。</text></g></svg>
