<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><style>text{font-family:Microsoft YaHei,sans-serif;fill:#103f6b;font-size:18px}.title{font-size:27px;font-weight:700}.box{fill:#fffefa;stroke:#e0dace}.blue{fill:#eaf4fb;stroke:#d0e3ef}</style><rect width="1440" height="900" fill="#fbf8f0"/><text x="40" y="50" class="title">职业探索 · 实施前结构示意（非网页截图）</text><rect x="40" y="90" width="640" height="760" rx="14" class="box"/><text x="65" y="130" class="title">看懂一种工作</text><rect x="65" y="155" width="590" height="125" rx="12" class="blue"/><text x="85" y="193">职业名 / 收藏与比较</text><text x="85" y="230">具体问题 → 怎样解决 → 交付什么</text><text x="65" y="325">真实工作中的三段行动</text><path d="M100 370H610" stroke="#b9d6e7"/><circle cx="120" cy="370" r="10" fill="#07558a"/><circle cx="355" cy="370" r="10" fill="#07558a"/><circle cx="590" cy="370" r="10" fill="#e8b600"/><text x="85" y="410">输入与问题</text><text x="290" y="410">处理与判断</text><text x="525" y="410">结果与复核</text><rect x="65" y="455" width="590" height="130" rx="12" class="blue"/><text x="85" y="495">工作侧重 / 容易混淆的边界</text><text x="85" y="535">典型产物与协作对象</text><text x="65" y="640">原代表案例、实际产物、准备、成长、体验</text><text x="65" y="695">原文与来源可回查 / 深链与返回恢复</text><rect x="710" y="90" width="690" height="360" rx="14" class="box"/><text x="735" y="130" class="title">先看区别，再做选择</text><rect x="735" y="155" width="310" height="95" rx="12" class="blue"/><rect x="1060" y="155" width="310" height="95" rx="12" class="blue"/><text x="760" y="195">建议方向 A / 可替换</text><text x="1080" y="195">建议方向 B / 可替换</text><text x="735" y="290">关键差异 / 工作 / 产物 / 准备 / 体验</text><text x="735" y="335">同一维度并排 · 原笔记与预览确认</text><rect x="710" y="480" width="690" height="370" rx="14" class="box"/><text x="735" y="525" class="title">研究岗位与管理本人机会</text><rect x="735" y="550" width="630" height="65" rx="10" class="blue"/><text x="755" y="590">关键词　职业方向　来源　查询 / 添加</text><text x="735" y="660">紧凑结果 / 原文与来源 / 保存研究卡</text><text x="735" y="715">研究 → 预算内准备 → 本人申请事件</text><text x="735" y="775">没有授