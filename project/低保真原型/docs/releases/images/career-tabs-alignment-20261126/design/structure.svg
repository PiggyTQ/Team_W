<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><rect width="1440" height="880" fill="#fbf8f0"/><g font-family="sans-serif" fill="#103f6b"><text x="50" y="40" font-size="18">实施前结构示意 · 非网页截图／非本人业务数据</text><rect x="50" y="65" width="1340" height="80" rx="14" fill="#fffefa" stroke="#e3ddd0"/><text x="74" y="113" font-size="26">当前页面标题</text><text x="860" y="110" font-size="21">职业方向　比较　企业与岗位　我的机会</text><rect x="50" y="170" width="1340" height="185" rx="18" fill="#edf6fc"/><text x="80" y="215" font-size="26">职业：主要工作／交付物／协作</text><text x="80" y="260" font-size="19">保留现有收藏、比较篮、实践与目标预览入口</text><text x="80" y="310" font-size="19">机会页：创建／浏览 + 原文到研究结果的明确示例</text><g font-size="21" text-anchor="middle"><text x="161" y="407">职业全貌</text><text x="384" y="407">代表案例</text><text x="607" y="407">能力与准备</text><text x="830" y="407">成长与协作</text><text x="1053" y="407">入门体验</text><text x="1276" y="407">来源与范围</text></g><path d="M50 437H1390" stroke="#c9dce9"/><path d="m146 425 12 6 17-15-12 1-8 7-12-4z" fill="#103f6b"/><rect x="50" y="465" width="1340" height="350" rx="16" fill="#fffefa" stroke="#e3ddd0"/><text x="80" y="515" font-size="26">当前章节正文</text><text x="80" y="560" font-size="19">六章节水平切换；只显示当前章节，不再纵向堆叠</text><text x="80" y="605" font-size="19">其余章节保持挂载并隐藏；实践工作稿保留</text><text x="80" y="650" font-size="19">来源深链／章节URL／刷新与后退／键盘及减少动态支持</text><text x="80" y="735" font-size="18">宽桌面：标题、导航与内容共用1440px最大宽度居中</text></g></svg>
