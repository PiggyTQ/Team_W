<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect width="1500" height="950" fill="#faf8ef"/><g fill="#234957" font-family="sans-serif"><text x="50" y="45" font-size="22">实施前结构示意 · 非实际截图</text><text x="50" y="105" font-size="28">SQL 表关联：为什么 130 变成 220？</text><text x="50" y="155" font-size="18">问题 → 观察匹配 → 修正输出 → 筛选与边界 → 尝试和复核</text><rect x="50" y="195" width="440" height="270" fill="#eff1e7"/><text x="75" y="235" font-size="20">解释与操作原因</text><text x="75" y="280">先观察重复，再引入键、粒度与一对多</text><rect x="520" y="195" width="925" height="270" fill="#e4ebdc"/><text x="550" y="235" font-size="20">输入 → 匹配关系 → 中间结果</text><text x="550" y="280">U ↔ 两条明细    V ↔ 无匹配（NULL）</text><text x="550" y="330">90 + 90 + 40 = 220</text><path d="M50 500H1445" stroke="#acbda6"/><text x="50" y="550" font-size="24">独立实践：不同任务各有答案、提示和核对状态</text><text x="50" y="590">SQL 编辑与实际输出 / 决策逐格填写 / 交接事实—证据—未知—责任</text><path d="M50 640H1445" stroke="#acbda6"/><text x="50" y="690" font-size="24">检验：技能标题与方向固定在整场景上方</text><rect x="50" y="720" width="800" height="170" fill="#eff1e7"/><text x="80" y="765">完整透明树 · 固定视觉位置 · 首次通过长叶</text><rect x="890" y="720" width="555" height="170" fill="#fffdf6"/><text x="920" y="765">题目 / 结果从同一顶部开始</text><text x="920" y="810">关键操作在可预期位置</text></g></svg>