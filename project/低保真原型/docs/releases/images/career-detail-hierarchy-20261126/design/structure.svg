<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100"><rect width="1440" height="1100" fill="#fbf8f0"/><g font-family="sans-serif" fill="#103f6b"><text x="45" y="35" font-size="17">实施前结构 · 非实际截图 · 复用站内学习／项目工作区层级</text><rect x="45" y="65" width="1350" height="70" rx="15" fill="#edf6fc"/><text x="75" y="108" font-size="25">六章节等宽页签与现有横向指示器保留</text><rect x="45" y="158" width="1350" height="145" rx="18" fill="#eaf4fc" stroke="#d3e5f1"/><rect x="45" y="184" width="5" height="45" rx="2" fill="#efbc16"/><text x="75" y="203" font-size="14">代表案例 · 原创合成教学</text><text x="75" y="244" font-size="28">一次典型工作：报名为什么减少了？</text><text x="75" y="277" font-size="17">工作问题是主线；范围与限制降低视觉权重</text><rect x="45" y="327" width="1350" height="340" rx="20" fill="#fffefa" stroke="#e4dfd3"/><path d="M585 350v290" stroke="#e0e8ed"/><text x="78" y="366" font-size="14">任务简报</text><text x="78" y="407" font-size="18">委托方：活动负责人</text><text x="78" y="457" font-size="25">有效报名变少了，先查哪里？</text><rect x="78" y="500" width="475" height="130" rx="12" fill="#f7f4ed"/><text x="98" y="533" font-size="17">输入与限制</text><text x="98" y="566" font-size="16">同一份报名日志与统一统计口径</text><text x="98" y="599" font-size="16">不把记录数当作人数，不直接认定原因</text><text x="618" y="367" font-size="20">产物预览</text><rect x="618" y="392" width="745" height="187" rx="10" fill="#fff" stroke="#d4e3ee"/><rect x="618" y="392" width="745" height="43" rx="10" fill="#e6f2fb"/><text x="642" y="420" font-size="17">渠道　　　　　　4月　　　　　5月　　　　　变化</text><text x="642" y="473" font-size="17">官网　　　　　　160　　　　　120　　　　　−40</text><text x="642" y="519" font-size="17">其他渠道　　　　160　　　　　160　　　　　 0</text><text x="642" y="560" font-size="17">合计　　　　　　320　　　　　280　　　　　−40</text><rect x="618" y="592" width="745" height="43" rx="8" fill="#fff3ce"/><text x="638" y="621" font-size="17">关键结果独立呈现：减少40条，降幅12.5%</text><rect x="45" y="690" width="830" height="145" rx="16" fill="#fffefa" stroke="#e4dfd3"/><text x="75" y="732" font-size="22">工作判断</text><text x="75" y="775" font-size="17">有序呈现处理与判断，不与来源／范围同级</text><rect x="900" y="690" width="495" height="145" rx="16" fill="#edf6fc"/><text x="930" y="732" font-size="22">谁来复核</text><text x="930" y="775" font-size="17">使用者、依据和复核方式</text><text x="45" y="887" font-size="26">完整交付物</text><rect x="45" y="912" width="1350" height="145" rx="17" fill="#fffefa" stroke="#dfdfd6"/><text x="78" y="954" font-size="22">文件页：实际内容／表格／代码／图</text><path d="M1030 935v100" stroke="#e0e8ed"/><text x="1060" y="954" font-size="18">交给谁／验收看什么</text><text x="78" y="1011" font-size="16">其他五章节分别使用路线、能力工作纸、协作清单和实践工作区</text></g></svg>
