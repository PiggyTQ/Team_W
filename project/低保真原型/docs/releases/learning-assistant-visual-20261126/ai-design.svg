<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><rect width="1440" height="940" fill="#fbf8f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#073e73"><text x="36" y="45" font-size="24" font-weight="700">AI 工作台恢复 · 实施前结构示意</text><text x="36" y="76" font-size="14">依据用户图二；原角色与业务沿用。不是浏览器实拍。</text><rect x="30" y="100" width="880" height="780" rx="20" fill="#fffdf8" stroke="#e9e0d2"/><text x="60" y="146" font-size="25" font-weight="700">AI 工作台</text><text x="580" y="146" font-size="15">历史讨论　本人笔记　新讨论</text><ellipse cx="465" cy="257" rx="75" ry="42" fill="#ffda51"/><text x="415" y="262" font-size="16">现有笔记本角色</text><text x="290" y="351" font-size="35" font-weight="700">和芝识分子聊聊</text><text x="260" y="394" font-size="18" fill="#697b8f">从一个问题开始，一起理清方向与下一步。</text><rect x="100" y="438" width="740" height="190" rx="18" fill="#fff" stroke="#d8ccba"/><text x="125" y="480" font-size="18" fill="#748498">说说你现在想理清的事…</text><text x="125" y="597" font-size="16">⌕ 本次资料</text><rect x="775" y="566" width="44" height="44" rx="11" fill="#ffca08"/><text x="788" y="596" font-size="27">↑</text><path d="M345 678v70m245-70v70" stroke="#e5dfd4"/><g font-size="18" font-weight="700"><text x="120" y="704">梳理我的下一步</text><text x="370" y="704">比较职业方向</text><text x="615" y="704">整理成果表达</text></g><g font-size="14" fill="#697b8f"><text x="120" y="738">根据选中资料一起想</text><text x="370" y="738">看清差异与取舍</text><text x="615" y="738">讲清做法和贡献</text><text x="290" y="806">资料由你选择，建议由你决定是否采用。</text></g><text x="960" y="145" font-size="23" font-weight="700">三个任务页</text><rect x="950" y="175" width="455" height="100" rx="18" fill="#fff" stroke="#e9e0d2"/><text x="972" y="217" font-size="20">任务图标 / 标题 / 简短说明</text><text x="972" y="249" font-size="14">返回工作台与历史、笔记、新讨论</text><rect x="950" y="300" width="162" height="300" rx="18" fill="#fff8e5" stroke="#e9e0d2"/><rect x="1126" y="300" width="279" height="300" rx="18" fill="#fff" stroke="#e9e0d2"/><text x="970" y="345" font-size="18">选择材料</text><text x="1147" y="345" font-size="18">围绕当前任务讨论</text><text x="970" y="387" font-size="14">对象 / 原任务</text><text x="970" y="420" font-size="14">范围 / 临时条件</text><rect x="1147" y="450" width="236" height="122" rx="13" fill="#fffdf8" stroke="#d8ccba"/><text x="1162" y="489" font-size="15">同一输入和资料语言</text><text x="1162" y="542" font-size="14">资料　　　　　　↑</text><rect x="950" y="625" width="455" height="180" rx="18" fill="#edf5fb"/><text x="972" y="668" font-size="18">职业比较保留同维对照</text><text x="972" y="707" font-size="15">双方选择 → 差异阅读 → 问题讨论</text><text x="972" y="748" font-size="15">窄处纵向重排，完整内容仍可读</text><text x="972" y="783" font-size="14">不改对象、授权、草稿及业务确认</text></g></svg>
