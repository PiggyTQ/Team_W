<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>职业成长树 · 实施前设计</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fffefa; color: #173b60; font: 15px/1.6 "Microsoft YaHei",sans-serif; }
main { max-width: 1200px; margin: auto; padding: 24px 20px; }
h1,h2,p { margin: 0 0 10px; }
h1 { font-size: 32px; }
h2 { font-size: 22px; }
.caption { color: #506475; }
.scene {
  position: relative;
  aspect-ratio: 1.92;
  border: 1px solid #d8e5ef;
  border-radius: 18px;
  background: radial-gradient(ellipse at 50% 54%,#e8f4ff,#f3f8fd 51%,#fffefa);
}
.tree { position: absolute; inset: 3.88% 5% auto; width: 90%; height: 82.23%; opacity: .77; }
.rings { position: absolute; inset: 0; width: 100%; height: 100%; }
.branch,.root,.bud {
  position: absolute;
  transform: translate(-50%,-50%);
}
.branch,.root {
  background: #fbfdff;
  border: 1px solid #b8cde0;
  border-radius: 9px;
  padding: 6px 10px;
  white-space: nowrap;
}
.branch b,.root b { color: #22644f; margin-left: 9px; }
.branch.active { background: #edf6fe; border-color: #7da8c6; border-bottom: 3px solid #22644f; }
.bud { width: clamp(13px,2.5vw,27px); }
.bud.done {
  display: grid;
  place-items: center;
  border: 1px solid white;
  border-radius: 50%;
  width: 17px;
  height: 17px;
  background: #22644f;
  color: white;
  font-size: 11px;
}
.leaves { position: absolute; width: 9.4%; left: 21.4%; top: 53.3%; transform: translate(-41%,-92%); }
.root { bottom: 2.8%; left: 50%; transform: translateX(-50%); font-weight: 700; }
.map-foot { display: flex; justify-content: space-between; gap: 14px; margin: 10px 0 24px; }
.route { display: flex; gap: 12px; margin: 10px 0; padding: 0; list-style: none; }
.route li { flex: 1; padding: 10px; border: 1px solid #d8e5ef; background: #fbfdff; border-radius: 9px; }
.note { max-width: 76ch; margin-top: 25px; }
@media (max-width: 640px) {
  main { padding: 15px; }
  .scene { aspect-ratio: 1.63; }
  .branch,.root { padding: 2px 4px; font-size: 10px; }
  .branch b,.root b { margin-left: 3px; }
  .route { gap: 6px; }
  .route li,.map-foot { font-size: 12px; }
}
</style>
<main>
  <p class="caption">实施前视觉与交互标注 · 一个节点通过示意</p>
  <h1>职业与技能地图</h1>
  <div class="scene">
    <img class="tree" src="../../src/assets/skill-tree/spirit-tree.webp" alt="半透明银蓝色树形，短主干向外展开四根枝条">
    <svg class="rings" viewBox="0 0 1672 1030" preserveAspectRatio="none" aria-hidden="true">
      <path d="M790 747 Q757 668 644 647" fill="none" stroke="#72b496" stroke-width="25" opacity=".62"/>
      <g transform="translate(800 825) rotate(-12)" fill="none" stroke="#628aa9" stroke-width="2">
        <ellipse rx="38" ry="19"/><ellipse rx="32" ry="16"/><ellipse rx="26" ry="13"/>
        <ellipse rx="20" ry="10"/><ellipse rx="14" ry="7" stroke="#1d7657" stroke-width="3"/>
      </g>
    </svg>
    <img class="leaves" src="../../src/assets/skill-tree/sprout-fan.webp" alt="">
    <span class="branch active" style="left:29.4%;top:75.4%">指标与取数<b>1/3</b></span>
    <span class="branch" style="left:35.1%;top:41.7%">数据质量<b>0/3</b></span>
    <span class="branch" style="left:71.7%;top:43.5%">统计判断<b>0/3</b></span>
    <span class="branch" style="left:71.1%;top:76%">建模与表达<b>0/4</b></span>
    <span class="bud done" style="left:21.4%;top:53.3%">✓</span>
    <img class="bud" style="left:14.3%;top:48.8%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:7.2%;top:62%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:38.1%;top:32.1%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:30.2%;top:25.8%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:18.2%;top:27%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:59.4%;top:29.6%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:65%;top:10.9%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:86.2%;top:11.9%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:75.9%;top:59.3%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:83.9%;top:47.1%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:90%;top:52.6%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <img class="bud" style="left:92%;top:68%" src="../../src/assets/skill-tree/dewdrop.webp" alt="">
    <div class="root">数据分析<b>1 / 13 已通过</b></div>
  </div>
  <div class="map-foot"><span>点击露珠学习。通过检验后，露珠长成叶片，树心染上一圈年轮。</span><span>技能依据</span></div>
  <h2>指标与取数</h2>
  <p>分支进度 33%</p>
  <ol class="route"><li>1 指标口径 · 已通过</li><li>2 SQL 表关联</li><li>3 分组与汇总</li></ol>
  <p class="note">页面内使用白色至冰蓝色底面衬托银蓝树身。树图对应四条分支和 12–13 个节点。枝梢露珠在通过后变为三至四片叶子，枝干同步从银蓝染成青绿。每项通过记录对应树心的一圈年轮。窄屏把分支按钮移到树图下方，画面保留当前分支的露珠入口。</p>
</main>
</html>
