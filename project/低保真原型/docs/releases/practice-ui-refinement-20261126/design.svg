<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><rect width="1440" height="920" fill="#fbf8ef"/><g font-family="Microsoft YaHei, sans-serif" fill="#073e73"><text x="40" y="48" font-size="26" font-weight="700">资源中心与项目页 · 实施前结构示意</text><text x="40" y="82" font-size="15">示意布局，数据与学习状态按实际目录显示；不是已实现页面</text><rect x="40" y="110" width="650" height="190" rx="24" fill="#eaf4fc"/><text x="65" y="155" font-size="23" font-weight="700">从一个项目，走向下一项能力</text><text x="65" y="190" font-size="16">蓝黄品牌引导 / 既有角色插画 / 真实数量</text><rect x="65" y="220" width="595" height="53" rx="12" fill="white"/><text x="82" y="252" font-size="16">方向筛选　阶段筛选　查看全部方向</text><text x="40" y="345" font-size="23" font-weight="700">当前职业路线</text><g fill="white" stroke="#e7decf"><rect x="40" y="365" width="208" height="270" rx="19"/><rect x="261" y="365" width="208" height="270" rx="19"/><rect x="482" y="365" width="208" height="270" rx="19"/></g><g font-size="18"><text x="62" y="410">01　入门</text><text x="283" y="410">02　增加约束</text><text x="504" y="410">03　独立交付</text><text x="62" y="459">职业任务图标</text><text x="283" y="459">项目与具体产物</text><text x="504" y="459">项目与具体产物</text></g><g fill="#ffcb18"><rect x="62" y="563" width="164" height="43" rx="21"/><rect x="283" y="563" width="164" height="43" rx="21"/><rect x="504" y="563" width="164" height="43" rx="21"/></g><g font-size="15"><text x="95" y="590">查看任务</text><text x="316" y="590">查看任务</text><text x="537" y="590">查看任务</text></g><rect x="730" y="110" width="670" height="130" rx="22" fill="#eaf4fc"/><text x="755" y="155" font-size="24" font-weight="700">项目名称与真实交付目标</text><text x="755" y="199" font-size="16">预计投入 / 阶段 / 版本与试用状态</text><rect x="730" y="260" width="670" height="80" rx="16" fill="white" stroke="#e7decf"/><text x="754" y="306" font-size="18">01 理解材料 → 02 制作与本机运行 → 03 核对与归档</text><rect x="730" y="360" width="425" height="270" rx="20" fill="white" stroke="#e7decf"/><rect x="1175" y="360" width="225" height="270" rx="20" fill="#fff5cf"/><text x="755" y="403" font-size="22">拿到什么 / 要交什么</text><text x="755" y="444" font-size="16">可读的输入材料摘要与用途</text><text x="755" y="480" font-size="16">产物文件及编写说明</text><text x="755" y="535" font-size="16">▸ 原始JSON与字段字典</text><text x="1195" y="405" font-size="21">开始实践</text><text x="1195" y="449" font-size="16">完整包 / 任务书</text><text x="1195" y="488" font-size="16">估时的实际含义</text><rect x="1195" y="548" width="185" height="46" rx="22" fill="#ffcb18"/><text x="1214" y="578" font-size="16">安排并进入实践</text><rect x="730" y="650" width="670" height="190" rx="20" fill="white" stroke="#e7decf"/><text x="755" y="694" font-size="22">产物编辑 / 运行 / 检查</text><text x="755" y="733" font-size="16">检查项显示用途与待改文件，不只显示内部ID</text><text x="755" y="775" font-size="16">结果值核对 ≠ 已运行用户代码 ≠ 职业能力认证</text><text x="40" y="700" font-size="18">小屏按可用空间折为两列/单列</text><text x="40" y="741" font-size="18">新旧项目统一边缘，正文保留合理行长</text><text x="40" y="781" font-size="18">来源、草稿、预算、版本和技能检验保持真实</text></g></svg>
