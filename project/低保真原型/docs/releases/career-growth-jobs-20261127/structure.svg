<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920"><rect width="1280" height="920" fill="#faf8f1"/><g font-family="Microsoft YaHei, sans-serif" fill="#163f67"><text x="54" y="58" font-size="29">成长与协作 · 实施前结构示意</text><text x="54" y="88" font-size="15">以同一职业案例解释责任变化；非最终页面截图</text><rect x="50" y="118" width="1180" height="100" rx="18" fill="#edf6fc" stroke="#d4e5f2"/><text x="76" y="158" font-size="22">具体委托、给定材料与协作对象</text><text x="76" y="192" font-size="16">用户先知道要解决哪件事，再看责任范围怎样变化。</text><g fill="#fffefa" stroke="#d7e3ec"><rect x="50" y="242" width="380" height="76" rx="12"/><rect x="450" y="242" width="380" height="76" rx="12"/><rect x="850" y="242" width="380" height="76" rx="12"/><rect x="50" y="340" width="1180" height="250" rx="18"/></g><text x="76" y="287" font-size="20">01 按已定范围交付</text><text x="476" y="287" font-size="20">02 独立处理例外</text><text x="876" y="287" font-size="20">03 维护团队规则</text><text x="76" y="384" font-size="22">具体任务与实际产物片段</text><rect x="76" y="410" width="1128" height="86" rx="9" fill="#f2f7fb"/><text x="98" y="448" font-size="18">这里直接呈现问题记录、决策说明或交付内容</text><text x="98" y="478" font-size="16">不只写“形成一份报告”或“与团队沟通”</text><text x="76" y="548" font-size="17">可决定什么 / 谁来复核 / 扩大范围的证据</text><rect x="50" y="616" width="1180" height="116" rx="18" fill="#fffefa" stroke="#d7e3ec"/><text x="76" y="660" font-size="22">完整交接：原始材料 → 本人处理 → 接收角色 → 验收</text><text x="76" y="698" font-size="16">给出具体传递内容、下一位如何使用，以及一次退回修改。</text><rect x="50" y="758" width="1180" height="94" rx="16" fill="#fff8e4" stroke="#eadcae"/><text x="76" y="797" font-size="21">返工前后：错误、改动及结果</text><text x="76" y="829" font-size="16">来源、适用范围和原环境说明在正文之后按需阅读。</text><text x="50" y="892" font-size="15">岗位/机会页：22–24px岗位名 · 16px正文 · 13px来源日期 · 保留原业务与真实状态</text></g></svg>
