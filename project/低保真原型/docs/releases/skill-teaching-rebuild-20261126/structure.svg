<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060"><rect width="1240" height="1060" fill="#fbf8f0"/><g font-family="Microsoft YaHei,sans-serif" fill="#103f6b"><text x="55" y="48" font-size="25" font-weight="700">技能学习：从提示清单到可跟随的教学</text><text x="55" y="79" font-size="14">实施前结构示意，案例内容以每课实际教学包为准</text><rect x="55" y="105" width="1130" height="95" rx="18" fill="#fffefa" stroke="#e5dfd3"/><text x="78" y="145" font-size="18">职业 / 分支　　01 当前技能　→　02 下一技能　→　03 下一技能</text><text x="78" y="179" font-size="13">真实通过进度 / 返回整树；不再常驻一条短左栏</text><rect x="55" y="220" width="1130" height="140" rx="20" fill="#edf6fc" stroke="#d7e6f0"/><text x="82" y="264" font-size="27" font-weight="700">当前技能与具体学习目标</text><text x="82" y="307" font-size="17">本课能完成什么，以及实际要保存的产物</text><text x="69" y="404" font-size="17" font-weight="700">概念与原理</text><text x="275" y="404" font-size="17">完整示范</text><text x="478" y="404" font-size="17">自己试一遍</text><path d="M55 420h1130" stroke="#dbe6ee"/><rect x="55" y="442" width="1130" height="556" rx="20" fill="#fffefa" stroke="#e5dfd3"/><text x="82" y="487" font-size="22" font-weight="700">具体概念：定义、为什么、在本例中的作用</text><text x="82" y="526" font-size="16">主要讲解直接可读，避免一句“你应该检查……”就结束</text><rect x="82" y="551" width="1075" height="166" rx="13" fill="#f1f7fb"/><text x="105" y="588" font-size="20">完整案例示范</text><text x="105" y="623" font-size="16">给定输入 → 第一步中间结果 → 第二步推理 → 最终结果</text><text x="105" y="661" font-size="16">每步解释原因；实际代码 / 表格继续沿用原运行工作区</text><text x="82" y="764" font-size="21" font-weight="700">新情境判断与具体纠错</text><text x="82" y="803" font-size="16">选项反馈解释为什么错 / 为什么成立；可修改重试</text><text x="82" y="852" font-size="21" font-weight="700">独立迁移与自查</text><text x="82" y="890" font-size="16">自己的处理 + 可对照做法 + 具体检查条件；不假装自动评文字能力</text><path d="M82 923h1075" stroke="#e2e9ef"/><text x="82" y="960" font-size="15">▸ 本课方法资料、先修与范围说明（正文后按需查阅）</text></g></svg>
