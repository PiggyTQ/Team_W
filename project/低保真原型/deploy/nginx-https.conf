server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.250.133.180;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://47.250.133.180$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.250.133.180;
    ssl_certificate /etc/letsencrypt/live/career-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/career-growth/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /mascot/ { try_files $uri =404; expires 1h; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
