<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Registration service collaboration</title>
<style>body{margin:24px;font:17px/1.7 system-ui;background:#fbf8f0;color:#103f6b}main{max-width:780px;margin:auto}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:9px;border:1px solid #b6cbd7;border-radius:8px}button{background:#ffca0a;cursor:pointer}li{padding:8px}a{color:#07558a}:focus-visible{outline:3px solid #07558a;outline-offset:3px}[role=alert]{color:#9b2c18}</style>
<main><h1>Registration service collaboration</h1><p>Original local teaching interface. No data is sent.</p>
<form novalidate><label>Email <input id="email" type="email" required aria-describedby="feedback"></label><label>Next response <select id="outcome"><option>success</option><option>failure</option><option>timeout</option></select></label><button id="submit">Register</button><p id="feedback" role="status"></p></form>
</main><script>
const broken=false,byId=id=>document.getElementById(id);let sequence=0,page=1;
const field=byId('email'),feedback=byId('feedback'),button=byId('submit');field.oninput=()=>{if(!broken){sequence++;button.disabled=false;feedback.textContent='Input changed';}};document.querySelector('form').onsubmit=e=>{e.preventDefault();const value=field.value;if(!value||!value.includes('@')){feedback.setAttribute('role','alert');feedback.textContent=!value?'Email required':'Invalid email';field.focus();return;}feedback.setAttribute('role','status');const id=++sequence;button.disabled=true;feedback.textContent='Waiting';if('cross-registration-service'==='cross-registration-service'){fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[broken?'mail':'email']:value,key:'registration'})}).then(async response=>{const body=await response.json();if(id!==sequence)return;button.disabled=false;feedback.textContent=response.ok?'Registered '+body.count:'Contract rejected '+response.status;}).catch(()=>{button.disabled=false;feedback.textContent='Open this interface through node serve.mjs for the joint API test';});return;}const result=byId('outcome').value;setTimeout(()=>{if(!broken&&id!==sequence)return;button.disabled=false;feedback.textContent=result==='success'?'Registered in local mock':result==='timeout'?'Timeout; retry':'Failed; input retained';if(broken)field.value='';},250);};
</script></html>
